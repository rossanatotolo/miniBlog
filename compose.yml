services:
  app:
    build: .
    image: mini-blog
    container_name: mini-blog
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/miniBlog
      - SPRING_DATASOURCE_USERNAME=min
      - SPRING_DATASOURCE_PASSWORD=1234

  db:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=1234
      - POSTGRES_USER=min
      - POSTGRES_DB=miniBlog
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10